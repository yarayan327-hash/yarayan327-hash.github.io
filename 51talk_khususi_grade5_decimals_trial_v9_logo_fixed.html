<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Grade 5 Decimals - Concept First</title>
<style>
:root{
  --bg:#f5f7fb; --card:#fff; --ink:#172033; --muted:#667085;
  --primary:#3867ff; --accent:#ffbf3f; --good:#2ca66f; --line:#dbe2ef;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Inter,Segoe UI,Arial,"Noto Sans Arabic",sans-serif;background:var(--bg);color:var(--ink)}
body{overflow:hidden}
.app{height:100vh;display:grid;grid-template-rows:64px 1fr 72px}
.topbar,.footer{background:#fff;border-color:var(--line);display:flex;align-items:center}
.topbar{border-bottom:1px solid var(--line);justify-content:space-between;padding:0 22px}
.footer{border-top:1px solid var(--line);justify-content:center;position:relative}
.brand{font-weight:900;font-size:20px}
.langs{display:flex;gap:6px;background:#f1f3f7;padding:5px;border-radius:14px}
.langs button{border:0;background:transparent;padding:9px 13px;border-radius:10px;font-weight:800;cursor:pointer}
.langs button.active{background:#fff;color:var(--primary);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.stage{padding:14px 18px;overflow:hidden}
.slide{display:none;height:100%;background:#fff;border-radius:24px;padding:20px 28px;overflow:hidden;box-shadow:0 14px 38px rgba(31,47,78,.09)}
.slide.active{display:block}
.slide-inner{height:100%;transform-origin:top center}
[dir=rtl]{text-align:right}
.eyebrow{color:var(--primary);font-size:13px;font-weight:900;letter-spacing:.8px;margin-bottom:5px}
h1{font-size:clamp(34px,3.3vw,48px);margin:0 0 10px}
h2{font-size:clamp(28px,2.5vw,38px);margin:0 0 10px}
h3{font-size:clamp(18px,1.6vw,23px);margin:0 0 8px}
p{margin:0}
.sub{font-size:clamp(16px,1.35vw,20px);line-height:1.45;color:var(--muted)}
.hero,.two{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:center;height:100%}
.onecol{height:100%;display:flex;flex-direction:column;justify-content:center}
.card{background:#f8faff;border:1px solid #dce6ff;border-radius:22px;padding:18px}
.prompt{background:#f8fafc;border:1px solid var(--line);border-radius:16px;padding:13px 16px;font-size:clamp(17px,1.5vw,21px);font-weight:800}
.success{background:#effaf5;border:1px solid #bde7d1;color:#176b47;border-radius:16px;padding:12px 16px;font-size:clamp(17px,1.5vw,21px);font-weight:800}
.eq{text-align:center;font-weight:900;font-size:clamp(36px,3.8vw,58px);margin:10px 0}
.step{opacity:0;transform:translateY(6px);transition:.22s ease;pointer-events:none}
.step.revealed{opacity:1;transform:none}
.next{border:0;background:var(--primary);color:#fff;font-weight:900;font-size:20px;padding:15px 34px;border-radius:16px;min-width:220px;cursor:pointer}
.progress{position:absolute;left:22px;color:#7b8495;font-size:13px;font-weight:800}
.branch{position:absolute;right:22px;border:0;background:transparent;color:#a0a8b5;font-size:12px;cursor:pointer}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;align-items:center;line-height:1;min-width:64px}
.frac .top{border-bottom:3px solid currentColor;padding:0 8px 5px}
.frac .bottom{padding-top:5px}

/* THE single visual language: one fixed-size whole */
.whole-wrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.whole-label{font-weight:900;color:#344054}
.whole{
  width:min(52vw,520px);
  height:min(36vh,330px);
  border:4px solid #23324d;
  border-radius:12px;
  overflow:hidden;
  background:#fff;
  position:relative;
  display:grid;
}
.whole.ten{grid-template-columns:repeat(10,1fr)}
.whole.hundred{grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr)}
.whole.thousand{
  grid-template-columns:repeat(10,1fr);
  grid-template-rows:repeat(10,1fr);
}
/* 1000 visual stays same outer whole, with 10 layers represented by stripe overlay */
.cell{border-right:1px solid #aeb8c8;border-bottom:1px solid #aeb8c8;background:#fff}
.cell.fill{background:#3867ff}
.cell.fill2{background:#ffbf3f}
.layer-bars{display:flex;gap:5px;justify-content:center;margin-top:8px}
.layer-bars span{width:18px;height:10px;border-radius:3px;background:#dce3ef}
.layer-bars span.active{background:#3867ff}
.zoom-note{font-size:14px;color:#667085;text-align:center;margin-top:6px}
.logic-arrow{font-size:26px;font-weight:900;color:#667085;text-align:center;margin:6px 0}
.concept-flow{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:12px}
.concept-box{border:1px solid var(--line);border-radius:18px;padding:14px;background:#fbfcfe;text-align:center}
.concept-box .miniwhole{width:100%;aspect-ratio:1.55;border:3px solid #23324d;border-radius:9px;display:grid;overflow:hidden;margin-bottom:8px}
.miniwhole.ten{grid-template-columns:repeat(10,1fr)}
.miniwhole.hundred{grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr)}
.miniwhole.thousand{grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr);position:relative}
.miniwhole div{border-right:.6px solid #c6cfdb;border-bottom:.6px solid #c6cfdb}
.miniwhole.thousand:after{
  content:"× 10 layers";
  position:absolute;inset:auto 8px 8px 8px;background:rgba(255,255,255,.9);
  border:1px solid #d7deea;border-radius:8px;padding:3px;font-size:11px;font-weight:800;
}
.legend{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.pill{padding:7px 10px;border-radius:999px;background:#eef2f7;font-weight:800;font-size:14px}
.place{width:100%;border-collapse:separate;border-spacing:6px;margin-top:12px}
.place th,.place td{background:#f4f7fb;border:1px solid var(--line);padding:10px;border-radius:12px;text-align:center}
.place th{font-size:15px}.place td{font-size:28px;font-weight:900}
.seats{display:flex;gap:10px;justify-content:center;direction:ltr;margin:12px 0}
.seat{width:76px;height:68px;border:3px dashed #aeb8c8;border-radius:14px;display:grid;place-items:center;font-size:32px;font-weight:900;background:#fafbfd}
.seat.on{border-style:solid;border-color:var(--primary);background:#eaf0ff;color:var(--primary)}
.compare{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-top:14px}
.compare .card{text-align:center}
@media(max-height:720px){
 .app{grid-template-rows:56px 1fr 62px}
 .slide{padding:14px 22px}
 .whole{width:min(48vw,460px);height:min(31vh,260px)}
 .eq{margin:6px 0}
}

/* ===== Cake-based concept visuals ===== */
.whole-wrap{gap:10px}
.whole, .miniwhole{display:none !important}

.cake-stage{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:10px;
  width:100%;
}
.cake{
  width:min(34vh,300px);
  aspect-ratio:1;
  border-radius:50%;
  position:relative;
  filter:drop-shadow(0 10px 16px rgba(59,44,25,.12));
  background:#f7d8a8;
}
.cake::after{
  content:"";
  position:absolute;
  inset:10%;
  border-radius:50%;
  border:2px dashed rgba(112,72,29,.18);
  pointer-events:none;
}
.cake-ring{
  position:absolute;
  inset:0;
}
.cake-slice{
  position:absolute;
  inset:0;
  border-radius:50%;
  clip-path:polygon(50% 50%, 50% 0%, 79.4% 9.5%, 97.6% 34.5%, 97.6% 65.5%, 79.4% 90.5%, 50% 100%, 20.6% 90.5%, 2.4% 65.5%, 2.4% 34.5%, 20.6% 9.5%);
  pointer-events:none;
}
.cake-lines{
  position:absolute;
  inset:0;
}
.cake-lines span{
  position:absolute;
  left:50%;
  top:50%;
  width:2px;
  height:50%;
  background:rgba(88,56,24,.45);
  transform-origin:50% 0;
}
.cake .center-dot{
  position:absolute;
  width:10px;height:10px;border-radius:50%;
  background:#70481f;left:50%;top:50%;transform:translate(-50%,-50%);
}
.cake-caption{
  font-weight:900;
  text-align:center;
  color:#344054;
  font-size:clamp(15px,1.3vw,19px);
}

.slice-card{
  width:min(42vw,420px);
  padding:16px;
  border:1px solid #ead8c3;
  border-radius:22px;
  background:#fffaf4;
}
.slice-zoom{
  width:100%;
  height:150px;
  position:relative;
  overflow:hidden;
}
.slice-piece{
  width:100%;
  height:100%;
  background:linear-gradient(180deg,#f3c98c,#eebd73);
  clip-path:polygon(0 50%,100% 0,100% 100%);
  position:relative;
  border-radius:12px;
}
.slice-divisions{
  position:absolute;
  inset:0;
  display:grid;
  grid-template-columns:repeat(10,1fr);
  clip-path:polygon(0 50%,100% 0,100% 100%);
}
.slice-divisions span{
  border-right:1px solid rgba(91,60,29,.45);
  background:rgba(255,255,255,.06);
}
.slice-divisions span:first-child{
  background:rgba(56,103,255,.65);
}
.slice-label{
  margin-top:8px;
  text-align:center;
  font-weight:900;
}

.cake-flow{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin-top:12px;
}
.cake-card{
  border:1px solid var(--line);
  border-radius:18px;
  padding:14px;
  background:#fbfcfe;
  text-align:center;
  min-height:260px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}
.cake-card .cake{width:min(20vh,170px)}
.cake-card .slice-card{width:100%;padding:8px}
.cake-card .slice-zoom{height:95px}

.bite-row{
  display:flex;
  justify-content:center;
  gap:4px;
  margin:10px 0;
}
.bite{
  width:26px;height:38px;
  border-radius:8px 8px 12px 12px;
  background:#efc07a;
  border:1px solid #d9a65f;
}
.bite.active{background:#3867ff;border-color:#3867ff}

@media(max-height:720px){
  .cake{width:min(29vh,250px)}
  .cake-card{min-height:220px}
  .cake-card .cake{width:min(16vh,135px)}
  .slice-zoom{height:120px}
}


/* ===== 51Talk visual refresh ===== */
:root{--primary:#1777ff;--primary-soft:#eaf4ff;--accent:#ffd92f;--ink:#16233b;--muted:#6f7b91;--line:#dceaff}
body{background:#f4f9ff}
.topbar{border-bottom:1px solid #e8f0fb}
.brand-badge{background:#1777ff!important;border-radius:14px}
.slide{border-radius:28px;box-shadow:0 16px 45px rgba(39,96,160,.10)}
.math-card,.card{background:#f8fbff!important;border-color:#dceaff!important}
.prompt{background:#f5f9ff!important;border-color:#dceaff!important}
.success{background:#effbf6!important;border-color:#bdebd7!important;color:#15734a!important}
.next-btn{background:#1777ff!important}
.eyebrow{color:#1777ff!important}
.hero-tag{display:inline-block;background:#ffd92f;border-radius:999px;padding:7px 12px;font-weight:900;margin-bottom:12px}

/* Square cake: 10 x 10 equal pieces */
.square-cake-wrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.square-cake{
  width:min(34vh,320px);aspect-ratio:1;
  display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr);
  border:6px solid #efb558;border-radius:18px;overflow:hidden;background:#f8d79d;
  box-shadow:0 12px 24px rgba(149,99,35,.14)
}
.sq{border-right:1px solid rgba(133,88,31,.35);border-bottom:1px solid rgba(133,88,31,.35);background:#f8d79d}
.sq.blue{background:#1777ff}
.share-labels{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.share-label{padding:7px 10px;border-radius:999px;background:#edf6ff;font-weight:900;color:#315d91}

/* 1 L = 1000 mL visual */
.jug-wrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.jug{
  width:200px;height:320px;border:6px solid #9fd0ff;border-radius:24px 24px 34px 34px;
  position:relative;background:#f8fcff;overflow:hidden
}
.water{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#79c8ff,#2498ff)}
.water.full{height:100%}.water.ml56{height:5.6%}
.scale{
  position:absolute;right:10px;top:12px;bottom:12px;width:55px;
  display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;
  color:#5b708c;font-size:12px;font-weight:900
}
.scale span:before{content:"";display:inline-block;width:18px;border-top:2px solid #8fbce8;margin-right:4px;vertical-align:middle}
.ml-card{background:#eaf6ff;border:1px solid #cfe9ff;border-radius:18px;padding:10px 14px;font-weight:900;text-align:center}
.logic-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}
.logic-box{border:1.5px solid #dceaff;border-radius:20px;padding:14px;background:#fbfdff;text-align:center}
.logic-box strong{display:block;margin-bottom:8px}
@media(max-height:720px){.square-cake{width:min(29vh,250px)}.jug{width:160px;height:250px}}


/* ===== Progressive practice bank ===== */
.practice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:12px}
.practice-card{border:1.5px solid #dceaff;border-radius:20px;padding:15px;background:#fbfdff;text-align:center}
.practice-card.easy{background:#f2fbf7;border-color:#cceedd}
.practice-card.medium{background:#f5f9ff;border-color:#cfe3ff}
.practice-card.hard{background:#fff9e8;border-color:#ffe493}
.level-pill{display:inline-block;border-radius:999px;padding:5px 10px;font-size:13px;font-weight:900;background:#fff;margin-bottom:8px}
.qmath{font-size:clamp(27px,2.6vw,40px);font-weight:900;min-height:52px;display:flex;align-items:center;justify-content:center;gap:8px;direction:ltr}
.answer{margin-top:8px;border-radius:12px;background:#fff;padding:8px;font-weight:900;color:#1777ff}
.choice-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.choice{padding:8px 12px;border:1.5px solid #cfe3ff;border-radius:12px;background:#fff;font-weight:900}
.teacher-note{margin-top:12px;padding:10px 14px;border-radius:14px;background:#eef6ff;color:#46617f;font-size:14px;font-weight:800}


/* ===== Khususi branding on every teaching page ===== */
.khususi-page-logo{
  position:absolute;
  top:12px;
  right:18px;
  width:126px;
  height:auto;
  border-radius:10px;
  z-index:20;
  box-shadow:0 3px 10px rgba(19,61,120,.08);
}
.slide-inner{
  padding-top:30px;
}
[dir="rtl"] .khususi-page-logo{
  right:18px;
  left:auto;
}
@media(max-height:720px){
  .khususi-page-logo{width:105px;top:8px;right:14px}
  .slide-inner{padding-top:24px}
}


/* ===== V8 visual system: 51Talk Khususi lesson UI ===== */
:root{
  --kh-blue:#176BFF;
  --kh-blue-dark:#0F2D62;
  --kh-blue-soft:#EEF7FF;
  --kh-blue-line:#CFE5FF;
  --kh-yellow:#FFD83D;
  --kh-yellow-soft:#FFF6B8;
  --kh-pink:#FFE5EA;
  --kh-ink:#132443;
  --kh-muted:#5F7293;
  --kh-card:#F7FBFF;
}

body{background:#f7fbff}
.app{grid-template-rows:90px 1fr 92px}

/* header */
.topbar{
  position:relative;
  justify-content:flex-end;
  min-height:90px;
  padding:0 28px;
  background:#fff;
  border-bottom:1px solid #dcecff;
}
.brand{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  gap:0;
}
.brand > :not(.kh-center-logo){display:none!important}
.kh-center-logo{
  display:block;
  width:178px;
  height:auto;
  border-radius:13px;
  box-shadow:0 4px 14px rgba(20,85,170,.10);
}
.lang-switch,.langs{
  margin-left:auto;
  background:#F0F4FA!important;
  padding:7px!important;
  border-radius:20px!important;
  gap:8px!important;
}
.lang-switch button,.langs button{
  padding:11px 17px!important;
  border-radius:13px!important;
  min-width:64px;
  font-size:16px!important;
}
.lang-switch button.active,.langs button.active{
  box-shadow:0 5px 15px rgba(29,72,131,.10)!important;
}

/* stage */
.stage{padding:18px 20px}
.slide{
  border:1.5px solid var(--kh-blue-line);
  border-radius:28px;
  padding:24px 32px;
  box-shadow:none;
  background:white;
}
.slide-inner{padding-top:0!important}
.khususi-page-logo{display:none!important}

.eyebrow{
  display:inline-block;
  color:var(--kh-blue-dark)!important;
  background:var(--kh-yellow)!important;
  border-radius:999px;
  padding:6px 13px;
  margin-bottom:10px;
  font-size:14px;
  letter-spacing:0;
}
.hero-tag{
  background:var(--kh-yellow)!important;
  color:var(--kh-blue-dark)!important;
  border-radius:999px!important;
  padding:7px 14px!important;
}
h1,h2{color:var(--kh-ink)}
h1{font-size:clamp(36px,3.4vw,52px)}
h2{font-size:clamp(28px,2.55vw,40px)}
.sub{color:var(--kh-muted)}

.card,.math-card,.practice-card,.logic-box,.concept-box,.cake-card{
  background:var(--kh-card)!important;
  border:1.5px solid var(--kh-blue-line)!important;
  border-radius:24px!important;
}
.prompt{
  background:white!important;
  border:1.5px solid var(--kh-blue-line)!important;
  border-left:0!important;
  border-right:0!important;
  border-radius:20px!important;
  color:var(--kh-ink);
}
.success{
  background:var(--kh-yellow-soft)!important;
  border:1px solid #FFE36A!important;
  color:var(--kh-blue-dark)!important;
  border-radius:18px!important;
}
.teacher-note{
  background:#FFF1F4!important;
  color:#6A4860!important;
  border-radius:18px!important;
  border:1px solid #FFD4DC!important;
}

.eq,.qmath{color:var(--kh-ink)}
.answer{color:var(--kh-blue)!important}
.seat.on{border-color:var(--kh-blue)!important;background:#EAF3FF!important;color:var(--kh-blue)!important}

/* footer navigation */
.footer{
  min-height:92px;
  background:#fff;
  border-top:1px solid #dcecff;
}
.next,.next-btn{
  min-width:300px!important;
  padding:18px 42px!important;
  background:linear-gradient(180deg,#2480FF,#1468F2)!important;
  border:2px solid #0B55D9!important;
  border-radius:24px!important;
  font-size:22px!important;
  box-shadow:0 8px 20px rgba(23,107,255,.18)!important;
}
.progress{
  left:28px!important;
  padding:8px 14px;
  background:#FFF7D6;
  color:#415B83!important;
  border-radius:999px;
  font-size:15px!important;
}

/* content split similar to generated visual */
.two{
  gap:26px;
  grid-template-columns:1.05fr .95fr;
}
.two > div{
  min-width:0;
}
.two > div:last-child:not(.cake-wrap):not(.square-cake-wrap):not(.jug-wrap){
  background:var(--kh-card);
  border:1.5px solid var(--kh-blue-line);
  border-radius:26px;
  padding:20px;
}

/* cake visuals cleaner */
.round-cake,.cake{
  filter:drop-shadow(0 10px 18px rgba(93,70,32,.12));
}
.square-cake{
  border-color:#E9B45A!important;
  border-radius:18px!important;
}
.sq.blue{background:var(--kh-blue)!important}

/* water visual */
.jug{
  width:230px!important;
  height:350px!important;
  border:5px solid #96C8FF!important;
  border-radius:28px 28px 36px 36px!important;
  background:#F8FCFF!important;
  box-shadow:0 8px 18px rgba(71,143,220,.10);
}
.water{background:linear-gradient(#74C9FF,#2C9DFF)!important}
.scale{
  right:14px!important;
  top:18px!important;
  bottom:18px!important;
  font-size:14px!important;
}
.ml-card{
  background:#EAF6FF!important;
  border:1.5px solid #C7E5FF!important;
  border-radius:22px!important;
  padding:12px 20px!important;
  font-size:22px;
  color:var(--kh-ink);
}

/* practice cards: lifestyle first feels more visual */
.practice-grid{gap:16px}
.practice-card{
  min-height:180px;
  padding:18px!important;
}
.practice-card.easy{background:#F3FBF8!important}
.practice-card.medium{background:#F4F9FF!important}
.practice-card.hard{background:#FFF9E5!important}
.level-pill{
  background:var(--kh-yellow)!important;
  color:var(--kh-blue-dark)!important;
}

/* Decorative corner blobs */
.slide:before{
  content:"";
  position:absolute;
  width:180px;height:90px;
  border-radius:0 0 100% 0;
  background:rgba(255,216,61,.22);
  left:0;top:0;
  pointer-events:none;
}
.slide:after{
  content:"";
  position:absolute;
  width:220px;height:90px;
  border-radius:100% 0 0 0;
  background:rgba(82,174,255,.10);
  right:0;bottom:0;
  pointer-events:none;
}

@media(max-height:760px){
  .app{grid-template-rows:76px 1fr 76px}
  .topbar{min-height:76px}

let lang="en", slide=0, step=0;
const slides=[...document.querySelectorAll(".slide")];
const digitMap={'0':'٠','1':'١','2':'٢','3':'٣','4':'٤','5':'٥','6':'٦','7':'٧','8':'٨','9':'٩','.':'٫'};

function arNum(v){return String(v).split("").map(c=>digitMap[c]||c).join("")}
function renderNums(){
 document.querySelectorAll("[data-num]").forEach(e=>e.textContent=lang==="ar"?arNum(e.dataset.num):e.dataset.num);
 document.querySelectorAll("[data-dec]").forEach(e=>e.textContent=lang==="ar"?arNum(e.dataset.dec):e.dataset.dec);
}
function applyLang(){
 document.querySelectorAll("[data-i18n]").forEach(e=>{const k=e.dataset.i18n;if(T[lang][k]!=null)e.textContent=T[lang][k]});
 document.querySelectorAll(".slide").forEach(e=>e.dir=lang==="ar"?"rtl":"ltr");
 document.querySelectorAll(".langs button").forEach(b=>b.classList.toggle("active",b.dataset.lang===lang));
 renderNums(); updateFooter(); fitSoon();
}
document.querySelectorAll(".langs button").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;applyLang()});


function buildCake(el, filledSlices=0){
  el.innerHTML="";
  // warm cake base
  el.style.background="#f3d39f";

  // radial cut lines for 10 equal slices
  const lines=document.createElement("div");
  lines.className="cake-lines";
  for(let i=0;i<10;i++){
    const line=document.createElement("span");
    line.style.transform=`rotate(${i*36}deg)`;
    lines.appendChild(line);
  }
  el.appendChild(lines);

  // overlay highlighted slices with conic gradient
  if(filledSlices>0){
    const angle=filledSlices*36;
    el.style.background=`conic-gradient(#3867ff 0deg ${angle}deg,#f3d39f ${angle}deg 360deg)`;
  }
  const dot=document.createElement("div");
  dot.className="center-dot";
  el.appendChild(dot);
}

document.querySelectorAll("[data-cake]").forEach(el=>{
  const type=el.dataset.cake;
  let n=0;
  if(type.includes("all")) n=10;
  else if(type.includes("three")) n=3;
  else if(type.includes("one")) n=1;
  buildCake(el,n);
});

function makeSquareCake(id, blueCount=0){
  const el=document.getElementById(id);
  if(!el) return;
  el.innerHTML="";
  for(let i=0;i<100;i++){
    const d=document.createElement("div");
    d.className="sq"+(i<blueCount?" blue":"");
    el.appendChild(d);
  }
}
makeSquareCake("cake100",0);
makeSquareCake("cake100one",1);
makeSquareCake("cake100ten",10);
makeSquareCake("cake10034",34);

function current(){return document.querySelector(`.slide[data-slide="${slide}"]`)}
function stepEls(){return [...current().querySelectorAll(".step")]}
function show(i){
 slides.forEach(s=>s.classList.remove("active"));slide=i;step=0;current().classList.add("active");
 current().querySelectorAll(".step").forEach(x=>x.classList.remove("revealed"));updateFooter();fitSoon();
}
function next(){
 const ss=stepEls();
 if(step<ss.length){ss[step++].classList.add("revealed");updateFooter();fitSoon();return}
 show(slide===slides.length-1?0:slide+1);
}
document.getElementById("nextBtn").onclick=next;
document.addEventListener("keydown",e=>{if([" ","Enter","ArrowRight"].includes(e.key)){e.preventDefault();next()}});

function updateFooter(){
 document.getElementById("progress").textContent=lang==="ar"?`${arNum(slide+1)} / ${arNum(slides.length)}`:`${slide+1} / ${slides.length}`;
 document.getElementById("nextBtn").textContent=T[lang].next;
}
function fitCurrent(){
 const s=current(), inner=s.querySelector(".slide-inner");
 inner.style.transform="none";inner.style.position="relative";inner.style.top="0";
 const scale=Math.min(1,s.clientWidth/inner.scrollWidth,s.clientHeight/inner.scrollHeight);
 inner.style.transform=`scale(${Math.max(.68,scale)})`;
 const h=inner.scrollHeight*Math.max(.68,scale);
 inner.style.top=`${Math.max(0,(s.clientHeight-h)/2)}px`;
}
function fitSoon(){requestAnimationFrame(()=>requestAnimationFrame(fitCurrent))}
window.addEventListener("resize",fitSoon);
applyLang();show(0);
</script>
